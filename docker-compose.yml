# Production-style stack: PostgreSQL + Django (gunicorn) + Nginx-served SPA.
# Secrets come from ./.env.production (copy .env.production.example and fill
# it in) and are passed with `docker compose --env-file .env.production up`.
# Nothing secret is committed here (security audit SEC-08).
services:
  db:
    image: postgres:16-alpine
    container_name: dora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dora_db}
      POSTGRES_USER: ${POSTGRES_USER:-dora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published on the host: only the backend container talks to it.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dora_backend
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dora_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dora_db}
      BACKUP_DIR: /backups
    volumes:
      - media_data:/app/media
      - backup_data:/backups
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dora_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-3000}:80"

volumes:
  postgres_data:
  media_data:
  backup_data:
